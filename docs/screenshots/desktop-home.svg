  <text x="96" y="440" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#111827">Bridge-Day Long Weekends</text>
  <text x="96" y="462" font-family="system-ui, sans-serif" font-size="12" fill="#6B7280">Sorted by days off per leave day \u2014 take the highlighted days to maximize your time away.</text>

