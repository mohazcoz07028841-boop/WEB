  <text x="720" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">sudmo comapny limited</text>
  <text x="720" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#E0E0FF">Find bridge-day long weekends in Kenya's public holiday calendar \u2014 one day of leave, four days off.</text>

